<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14251f">
  <meta name="description" content="Connect with Ambiance Consulting Group. Visit our website or Facebook page.">
  <title>Ambiance Consulting Group | Connect</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #182923;
      --muted: #65736d;
      --green: #183b30;
      --gold: #c4a66a;
      --paper: #f5f4ef;
      --white: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 28px 18px;
      display: grid; place-items: center;
      background: radial-gradient(circle at top, #e8e5d9 0, var(--paper) 55%);
      color: var(--ink);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }
    main {
      width: min(100%, 440px); padding: 42px 28px 30px;
      background: var(--white); border: 1px solid #e7e5dd;
      border-radius: 18px; box-shadow: 0 18px 55px rgba(24,41,35,.09);
      text-align: center;
    }
    .mark {
      width: 54px; height: 54px; margin: 0 auto 18px;
      display: grid; place-items: center; border: 1px solid var(--gold);
      color: var(--green); font-family: Georgia, serif; font-size: 25px;
      letter-spacing: -2px; border-radius: 50%;
    }
    .eyebrow {
      margin: 0 0 9px; color: #9b804c; font-size: 10px;
      font-weight: 700; letter-spacing: .24em; text-transform: uppercase;
    }
    h1 {
      margin: 0; color: var(--green); font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(25px, 7vw, 32px); font-weight: 500; letter-spacing: .015em;
    }
    .subtitle { margin: 10px 0 30px; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .links { display: grid; gap: 12px; }
    .link {
      min-height: 58px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 18px; border: 1px solid #d9ded9; border-radius: 9px;
      color: var(--green); background: #fff; text-decoration: none;
      font-size: 14px; font-weight: 650; transition: background .18s, border-color .18s, transform .18s;
    }
    .link.primary { background: var(--green); border-color: var(--green); color: #fff; }
    .link:hover { transform: translateY(-1px); border-color: var(--gold); }
    .arrow { font-size: 18px; color: var(--gold); }
    .primary .arrow { color: #e2c98f; }
    footer { margin-top: 32px; padding-top: 18px; border-top: 1px solid #eeede7; color: #89938e; font-size: 11px; letter-spacing: .04em; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">A</div>
    <p class="eyebrow">Consulting Group</p>
    <h1>Ambiance</h1>
    <p class="subtitle">Connect with us and learn more about our work.</p>
    <nav class="links" aria-label="Our online links">
      <a class="link primary" href="https://www.consultambiance.mw/" target="_blank" rel="noopener noreferrer">
        <span>Visit Our Website</span><span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="link" href="https://www.facebook.com/profile.php?id=61580066877738" target="_blank" rel="noopener noreferrer">
        <span>Find Us on Facebook</span><span class="arrow" aria-hidden="true">↗</span>
      </a>
    </nav>
    <footer>AMBiance CONSULTING GROUP</footer>
  </main>
</body>
</html>
